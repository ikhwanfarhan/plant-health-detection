<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Plant Health Detection System</title>

    <!-- FONT AWESOME -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }


        /* =========================
           BODY
        ========================= */

        body {
            min-height: 100vh;

            background: #071F12;

            color: #222;
        }


        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            height: 70px;

            background: #05170D;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding: 0 7%;

            box-shadow:
                0 3px 12px rgba(0, 0, 0, 0.30);

            border-bottom:
                1px solid rgba(123, 227, 107, 0.08);
        }


        .logo {
            display: flex;

            align-items: center;

            gap: 11px;

            color: #ffffff;

            font-size: 21px;

            font-weight: bold;
        }


        .logo i {
            font-size: 28px;

            color: #7BE36B;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav-links {
            display: flex;

            align-items: center;

            gap: 30px;
        }


        .nav-links a {
            color: white;

            text-decoration: none;

            font-size: 15px;

            font-weight: 600;

            transition: 0.2s ease;
        }


        .nav-links a:hover,
        .nav-links a.active {
            color: #7BE36B;
        }


        /* =========================
           MAIN
        ========================= */

        .main {
            min-height:
                calc(100vh - 70px);

            display: flex;

            justify-content: center;

            align-items: center;

            padding: 40px 20px 60px;
        }


        /* =========================
           LOGIN CARD
        ========================= */

        .login-card {
            width: 440px;

            max-width: 100%;

            background: #FFFFFF;

            padding: 42px 40px;

            border-radius: 18px;

            box-shadow:
                0 12px 35px rgba(0, 0, 0, 0.25);

            border:
                1px solid #E1ECE2;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            text-align: center;

            margin-bottom: 28px;
        }


        .leaf-icon {
            width: 68px;

            height: 68px;

            margin: 0 auto 17px;

            border-radius: 50%;

            background: #E8F5E9;

            display: flex;

            align-items: center;

            justify-content: center;
        }


        .leaf-icon i {
            color: #2E7D32;

            font-size: 30px;
        }


        .header h2 {
            color: #1B5E20;

            font-size: 28px;

            margin-bottom: 8px;
        }


        .header p {
            color: #666;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =========================
           FLASH MESSAGE
        ========================= */

        .message {
            display: flex;

            align-items: center;

            gap: 10px;

            background: #FFF8E1;

            color: #795900;

            border:
                1px solid #E6D48A;

            padding: 11px 13px;

            margin-bottom: 20px;

            border-radius: 9px;

            font-size: 14px;

            line-height: 1.4;
        }


        .message i {
            font-size: 16px;

            color: #C49A00;
        }


        /* =========================
           FORM
        ========================= */

        .form-group {
            margin-bottom: 19px;
        }


        label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-size: 15px;

            font-weight: bold;
        }


        .input-wrapper {
            position: relative;
        }


        .input-wrapper i {
            position: absolute;

            left: 14px;

            top: 50%;

            transform:
                translateY(-50%);

            color: #6B8B72;

            font-size: 16px;
        }


        input {
            width: 100%;

            padding:
                14px 14px 14px 43px;

            border:
                1px solid #CBDACD;

            border-radius: 9px;

            outline: none;

            background: #F8FBF8;

            color: #222;

            font-size: 15px;

            transition: 0.2s ease;
        }


        input::placeholder {
            color: #8A9A8E;
        }


        input:focus {
            border-color: #4CAF50;

            background: #FFFFFF;

            box-shadow:
                0 0 0 3px
                rgba(76, 175, 80, 0.12);
        }


        /* =========================
           LOGIN BUTTON
        ========================= */

        .login-btn {
            width: 100%;

            border: none;

            padding: 14px 16px;

            margin-top: 5px;

            background: #4CAF50;

            color: white;

            border-radius: 9px;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            transition: 0.2s ease;

            box-shadow:
                0 5px 12px
                rgba(76, 175, 80, 0.20);
        }


        .login-btn:hover {
            background: #2E7D32;

            transform:
                translateY(-1px);
        }


        .login-btn:active {
            transform:
                translateY(0);
        }


        /* =========================
           LINKS
        ========================= */

        .links {
            text-align: center;

            margin-top: 25px;

            font-size: 14px;

            color: #666;
        }


        .links p {
            margin-bottom: 17px;
        }


        .links a {
            color: #2E7D32;

            font-weight: bold;

            text-decoration: none;

            transition: 0.2s ease;
        }


        .links a:hover {
            color: #1B5E20;

            text-decoration: underline;
        }


        /* =========================
           ADMIN LOGIN
        ========================= */

        .admin-link {
            border-top:
                1px solid #E1E9E2;

            padding-top: 17px;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 5px;

            color: #666;
        }


        .admin-link i {
            color: #6B8B72;

            margin-right: 2px;
        }


        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 600px) {

            .navbar {
                height: 70px;

                padding: 0 5%;
            }


            .logo {
                font-size: 17px;
            }


            .logo i {
                font-size: 22px;
            }


            .nav-links {
                gap: 18px;
            }


            .nav-links a {
                font-size: 14px;
            }


            .main {
                min-height:
                    calc(100vh - 70px);

                padding:
                    30px 15px 50px;
            }


            .login-card {
                padding: 34px 25px;
            }


            .header h2 {
                font-size: 24px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         NAVBAR
    ========================= -->

    <div class="navbar">


        <!-- LOGO -->

        <div class="logo">

            <i class="fa-solid fa-leaf"></i>

            <span>
                Plant Health Detection
            </span>

        </div>


        <!-- NAVIGATION -->

        <div class="nav-links">

            <a href="{{ url_for('home') }}"
               class="active">

                Home

            </a>


            <a href="{{ url_for('about') }}">

                About

            </a>

        </div>

    </div>



    <!-- =========================
         MAIN
    ========================= -->

    <div class="main">


        <div class="login-card">


            <!-- =========================
                 HEADER
            ========================= -->

            <div class="header">


                <div class="leaf-icon">

                    <i class="fa-solid fa-leaf"></i>

                </div>


                <h2>
                    Welcome Back
                </h2>


                <p>
                    Login to analyze your plant health
                </p>


            </div>



            <!-- =========================
                 FLASH MESSAGES
            ========================= -->

            {% with messages =
                get_flashed_messages(with_categories=true)
            %}

                {% for category, message in messages %}

                    <div class="message">

                        <i class="fa-solid fa-circle-exclamation"></i>

                        <span>
                            {{ message }}
                        </span>

                    </div>

                {% endfor %}

            {% endwith %}



            <!-- =========================
                 LOGIN FORM
            ========================= -->

            <form method="POST">


                <!-- EMAIL -->

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-envelope"></i>


                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>

                    </div>

                </div>



                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>


                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>


                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>

                    </div>

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    class="login-btn"
                    type="submit">

                    <i class="fa-solid fa-right-to-bracket"></i>

                    <span>
                        Login
                    </span>

                </button>


            </form>



            <!-- =========================
                 LINKS
            ========================= -->

            <div class="links">


                <p>

                    Don't have an account?

                    <a href="{{ url_for('register') }}">
                        Register
                    </a>

                </p>



                <!-- ADMIN LOGIN -->

                <div class="admin-link">

                    <i class="fa-solid fa-user-shield"></i>

                    <span>
                        Administrator?
                    </span>

                    <a href="{{ url_for('admin_login') }}">
                        Admin Login
                    </a>

                </div>


            </div>


        </div>


    </div>


</body>

</html>
